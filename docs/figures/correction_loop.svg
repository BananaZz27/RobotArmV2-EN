<svg xmlns="http://www.w3.org/2000/svg" width="680" height="550" viewBox="0 0 680 550" role="img"><title>Correcting sag and backlash</title><desc>Loop: command, wait for the arm to settle, read the angles, compute the error, add 0.8 times the error until it is at most 0.5 degrees, with an example of a 1.5 degree shoulder sag</desc><style>
text{font-family:'Sarabun','Noto Sans Thai','Leelawadee UI','Tahoma',sans-serif}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#444441}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral text{fill:#712B13}.c-teal text{fill:#085041}.c-purple text{fill:#3C3489}.c-green{fill:#EAF3DE;stroke:#3B6D11}.c-green text{fill:#27500A}.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red text{fill:#791F1F}.c-blue{fill:#E6F1FB;stroke:#185FA5}.c-blue text{fill:#0C447C}.box{fill:#F8F7F3;stroke:#B4B2A9}
.leader{stroke:#888780;stroke-width:0.5;stroke-dasharray:3 3;fill:none}
</style><rect width="680" height="550" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-blue"><rect x="40" y="30" width="260" height="44" rx="8" stroke-width="0.5"/><text class="th" x="170" y="52" text-anchor="middle" dominant-baseline="central">Send q_cmd = q_target</text></g>
<line x1="170" y1="74" x2="170" y2="94" class="arr" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<rect class="box" x="40" y="96" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="170" y="114" text-anchor="middle" dominant-baseline="central">Wait for the arm to settle</text>
<text class="ts" x="170" y="134" text-anchor="middle" dominant-baseline="central">wait 0.4 s after the Mover arrives</text>
<line x1="170" y1="152" x2="170" y2="172" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<rect class="box" x="40" y="174" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="170" y="192" text-anchor="middle" dominant-baseline="central">Read q_actual</text>
<text class="ts" x="170" y="212" text-anchor="middle" dominant-baseline="central">error = q_target − q_actual</text>
<line x1="170" y1="230" x2="170" y2="250" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<rect class="box" x="40" y="252" width="260" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="170" y="270" text-anchor="middle" dominant-baseline="central">every joint |error| ≤ 0.5° ?</text>
<text class="ts" x="170" y="290" text-anchor="middle" dominant-baseline="central">or 3 rounds done</text>
<line x1="170" y1="308" x2="170" y2="328" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="160" y="322" text-anchor="end">yes</text>
<g class="c-green"><rect x="40" y="330" width="260" height="44" rx="8" stroke-width="0.5"/><text class="th" x="170" y="352" text-anchor="middle" dominant-baseline="central">Done: target reached</text></g>
<line x1="300" y1="280" x2="338" y2="280" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="319" y="272" text-anchor="middle">no</text>
<g class="c-coral"><rect x="340" y="252" width="290" height="56" rx="8" stroke-width="0.5"/><text class="th" x="485" y="270" text-anchor="middle" dominant-baseline="central">q_cmd = q_cmd + 0.8 × error</text><text class="ts" x="485" y="290" text-anchor="middle" dominant-baseline="central">total correction ≤ ±5° · within limits</text></g>
<path d="M485 252 L485 124 L302 124" fill="none" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="495" y="190">resend smoothly (Mover.goto_q)</text>
<text class="ts" x="495" y="208">then loop back to waiting</text>
<g class="c-red"><rect x="340" y="30" width="300" height="78" rx="8" stroke-width="0.5"/><text class="th" x="356" y="52">Give up immediately, no more commands, when</text><text class="ts" x="356" y="74">STOP pressed · servo voltage &lt; 6 V · servos not answering</text><text class="ts" x="356" y="94">first error > 5° · user issues a new command</text></g>
<text class="th" x="40" y="414">Example: shoulder sags 1.5°</text>
<line x1="100" y1="480" x2="600" y2="480" stroke="#5F5E5A" stroke-width="1"/>
<line x1="100" y1="475" x2="100" y2="485" stroke="#5F5E5A" stroke-width="1"/><text class="ts" x="100" y="498" text-anchor="middle">17°</text>
<line x1="200" y1="475" x2="200" y2="485" stroke="#5F5E5A" stroke-width="1"/><text class="ts" x="200" y="498" text-anchor="middle">18°</text>
<line x1="300" y1="475" x2="300" y2="485" stroke="#5F5E5A" stroke-width="1"/><text class="ts" x="300" y="498" text-anchor="middle">19°</text>
<line x1="400" y1="475" x2="400" y2="485" stroke="#5F5E5A" stroke-width="1"/>
<line x1="500" y1="475" x2="500" y2="485" stroke="#5F5E5A" stroke-width="1"/><text class="ts" x="500" y="498" text-anchor="middle">21°</text>
<line x1="600" y1="475" x2="600" y2="485" stroke="#5F5E5A" stroke-width="1"/><text class="ts" x="600" y="498" text-anchor="middle">22°</text>
<line x1="400" y1="446" x2="400" y2="500" stroke="#0F6E56" stroke-width="1.5" stroke-dasharray="4 3"/>
<text class="ts" x="400" y="438" text-anchor="middle">target 20°</text>
<circle cx="250" cy="480" r="7" fill="#D85A30"/>
<text class="ts" x="250" y="518" text-anchor="middle">round 0: got 18.5°</text>
<text class="ts" x="250" y="534" text-anchor="middle">error 1.5°</text>
<polygon points="520,472 514,462 526,462" fill="#185FA5"/>
<text class="ts" x="520" y="438" text-anchor="middle">resend 21.2°</text>
<text class="ts" x="520" y="454" text-anchor="middle">= 20 + 0.8 × 1.5</text>
<circle cx="370" cy="480" r="7" fill="#3B6D11"/>
<text class="ts" x="370" y="518" text-anchor="middle">round 1: got 19.7°</text>
<text class="ts" x="370" y="534" text-anchor="middle">error 0.3° ≤ 0.5 → done</text>
</svg>
