<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img"><title>Data flow in RobotArmV2</title><desc>The Qt window commands the Mover, which computes a pose every step; the Driver sends the pose 80 ms ahead through DirectLink to the adapter and servos; a thread reads back actual angles and voltage every 100 ms</desc><style>
text{font-family:'Sarabun','Noto Sans Thai','Leelawadee UI','Tahoma',sans-serif}
.ts{font-size:12px;fill:#444441}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-blue{fill:#E6F1FB;stroke:#185FA5}.c-coral{fill:#FAECE7;stroke:#993C1D}.box{fill:#F8F7F3;stroke:#B4B2A9}
.mono{font-family:'Consolas','Courier New',monospace;font-size:12px;fill:#2C2C2A}
</style><rect width="680" height="560" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="c-blue"><rect x="30" y="20" width="620" height="330" rx="10" stroke-width="0.5"/></g>
<text class="th" x="46" y="44" fill="#0C447C">PC — Python (src/)</text>
<rect class="box" x="46" y="58" width="190" height="56" rx="6" stroke-width="0.5"/><text class="th" x="141" y="80" text-anchor="middle">qt_app.py</text><text class="ts" x="141" y="100" text-anchor="middle">Joint · Jog · IK · Status · 3D</text>
<rect class="box" x="258" y="58" width="180" height="56" rx="6" stroke-width="0.5"/><text class="th" x="348" y="80" text-anchor="middle">kinematics.py</text><text class="ts" x="348" y="100" text-anchor="middle">FK (DH) · IK</text>
<rect class="box" x="460" y="58" width="174" height="56" rx="6" stroke-width="0.5"/><text class="th" x="547" y="80" text-anchor="middle">singularity.py</text><text class="ts" x="547" y="100" text-anchor="middle">|det J| = r·a2·a3·|sin θ3|</text>
<line x1="141" y1="114" x2="141" y2="146" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="150" y="136">goto_q / goto_xyz / jog / follow</text>
<rect class="box" x="46" y="150" width="588" height="62" rx="6" stroke-width="0.5"/><text class="th" x="62" y="172">motion.py — Mover (pose streamer)</text>
<text class="ts" x="62" y="194">next pose each step: ramps up/down · joints arrive together · brakes before limits · stops before singularities</text>
<line x1="141" y1="212" x2="141" y2="244" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="150" y="234">step(dt) then peek(80 ms)</text>
<rect class="box" x="46" y="248" width="588" height="86" rx="6" stroke-width="0.5"/><text class="th" x="62" y="270">driver.py — Driver (thread every ~40 ms)</text>
<text class="ts" x="62" y="292">send "the pose 80 ms ahead" + 80 ms → steady servo speed even though ticks jitter 27–52 ms</text>
<text class="ts" x="62" y="312">voltage &lt; 6 V / offline → stop + hold at actual angles · target reached → correct sag ≤ 3 rounds</text>
<line x1="200" y1="334" x2="200" y2="378" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="210" y="362">write goal (addr 42)</text>
<line x1="470" y1="378" x2="470" y2="334" stroke="#0F6E56" stroke-width="1.5" marker-end="url(#arrow)"/>
<text class="ts" x="480" y="362">read 56..63 every 100 ms</text>
<g class="c-teal"><rect x="30" y="380" width="620" height="70" rx="10" stroke-width="0.5"/></g>
<text class="th" x="46" y="404" fill="#085041">link.py — DirectLink → scs.py → USB COM11 → Bus Servo Adapter (A), jumper B</text>
<text class="mono" x="46" y="428">raw = center + dir × q × 4.092    q = dir × (raw − center) / 4.092</text>
<text class="ts" x="46" y="444">bus lock (reader thread + writes share one wire) · guard: a joint jumping &gt; 20° in a short command → not sent</text>
<line x1="340" y1="450" x2="340" y2="476" stroke="#5F5E5A" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="70" y="480" width="120" height="44" rx="6" stroke-width="0.5"/><text class="th" x="130" y="497" text-anchor="middle" dominant-baseline="central" fill="#3C3489">base ID 4</text><text class="ts" x="130" y="514" text-anchor="middle" dominant-baseline="central">center 484 · dir −1</text></g>
<g class="c-purple"><rect x="208" y="480" width="120" height="44" rx="6" stroke-width="0.5"/><text class="th" x="268" y="497" text-anchor="middle" dominant-baseline="central" fill="#3C3489">shoulder ID 9</text><text class="ts" x="268" y="514" text-anchor="middle" dominant-baseline="central">center 506 · dir −1</text></g>
<g class="c-purple"><rect x="346" y="480" width="120" height="44" rx="6" stroke-width="0.5"/><text class="th" x="406" y="497" text-anchor="middle" dominant-baseline="central" fill="#3C3489">elbow ID 7</text><text class="ts" x="406" y="514" text-anchor="middle" dominant-baseline="central">center 527 · dir +1</text></g>
<g class="c-purple"><rect x="484" y="480" width="120" height="44" rx="6" stroke-width="0.5"/><text class="th" x="544" y="497" text-anchor="middle" dominant-baseline="central" fill="#3C3489">wrist ID 2</text><text class="ts" x="544" y="514" text-anchor="middle" dominant-baseline="central">center 522 · dir −1</text></g>
<text class="ts" x="340" y="546" text-anchor="middle">center/dir/limit live only in src/config.py (Calibrate.bat edits them) · servo supply 7.4 V</text>
</svg>
