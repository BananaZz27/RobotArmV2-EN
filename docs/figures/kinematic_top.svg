<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img"><title>Kinematic diagram, top view (x-y plane)</title><desc>base angle θ1, horizontal distance r and the tip's x y</desc><style>
text{font-family:'Sarabun','Noto Sans Thai','Leelawadee UI','Tahoma',sans-serif}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#444441}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-gray{fill:#F1EFE8;stroke:#5F5E5A}
.leader{stroke:#888780;stroke-width:0.5;stroke-dasharray:3 3;fill:none}
</style><rect width="680" height="300" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line x1="180" y1="240" x2="440" y2="240" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="448" y="244">x₀</text>
<line x1="180" y1="240" x2="180" y2="50" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="188" y="54">y₀</text>
<line x1="368.4" y1="108.1" x2="368.4" y2="240" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 3"/>
<line x1="368.4" y1="108.1" x2="180" y2="108.1" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 3"/>
<text class="ts" x="368" y="258" text-anchor="middle">x</text>
<text class="ts" x="170" y="112" text-anchor="end">y</text>
<line x1="180" y1="240" x2="368.4" y2="108.1" stroke="#888780" stroke-width="7" stroke-linecap="round"/>
<path d="M240 240 A60 60 0 0 0 229.1 205.6" fill="none" stroke="#D85A30" stroke-width="1.5"/>
<text class="ts" x="252" y="226">θ₁</text>
<text class="ts" x="300" y="194">r = √(x² + y²)</text>
<circle cx="319.3" cy="142.5" r="3.5" fill="#534AB7"/>
<text class="ts" x="327" y="158">(xc, yc) wrist center</text>
<circle cx="368.4" cy="108.1" r="4" fill="#5F5E5A"/>
<text class="ts" x="376" y="100">tip (x, y)</text>
<circle class="c-teal" cx="180" cy="240" r="9" stroke-width="1"/>
<circle cx="180" cy="240" r="2" fill="#0F6E56"/>
<text class="ts" x="170" y="264" text-anchor="end">z₀ ⊙ points up</text>
<text class="th" x="480" y="150">Top view</text>
<text class="ts" x="480" y="174">θ₁ = atan2(y, x) = q₁</text>
<text class="ts" x="480" y="194">positive = turn left (CCW)</text>
<text class="ts" x="480" y="214">r = reach from the base axis</text>
<text class="ts" x="480" y="234">use r with s = z − d₁</text>
<text class="ts" x="480" y="254">in the side view</text>
<text class="ts" x="480" y="274">pose shown θ₁ = 35°</text>
</svg>
