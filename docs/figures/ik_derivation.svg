<rect class="c-purple" x="506" y="1026" width="470" height="30" rx="8" stroke-width="0.8"/>
<text class="th" x="518.0" y="1046.0" text-anchor="start" fill="#3C3489">Step 6 · θ → q, limit check, FK check</text>
<text class="th" x="520.0" y="1084.0" text-anchor="start" fill="#3C3489">joint</text>
<text class="th" x="618.0" y="1084.0" text-anchor="start" fill="#3C3489">θ (DH)</text>
<text class="th" x="688.0" y="1084.0" text-anchor="start" fill="#3C3489">q =</text>
<text class="th" x="768.0" y="1084.0" text-anchor="start" fill="#3C3489">q</text>
<text class="th" x="828.0" y="1084.0" text-anchor="start" fill="#3C3489">limit</text>
<text class="th" x="942.0" y="1084.0" text-anchor="start" fill="#3C3489"></text>
<line x1="516.0" y1="1091.0" x2="966.0" y2="1091.0" stroke="#5F5E5A" stroke-width="0.6"/>
