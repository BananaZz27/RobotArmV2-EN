<circle cx="203.1" cy="1083.9" r="3.5" fill="#FFFFFF" stroke="#888780" stroke-width="1.5"/>
<circle cx="295.9" cy="1143.1" r="3.5" fill="#FFFFFF" stroke="#888780" stroke-width="1.5"/>
<line x1="295.9" y1="1143.1" x2="339.4" y2="1170.8" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="295.9" y1="1143.1" x2="363.1" y2="1143.1" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="203.1" y1="1083.9" x2="270.3" y2="1083.9" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="3 3"/>
<line x1="128.0" y1="1217.7" x2="184.0" y2="1217.7" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="3 3"/>
<path d="M158.0 1217.7 A30 30 0 0 0 142.7 1191.5" fill="none" stroke="#D85A30" stroke-width="1.6"/>
<text class="ts" x="166.0" y="1199.5" text-anchor="middle" fill="#D85A30">θ₂</text>
<path d="M233.1 1083.9 A30 30 0 0 1 228.4 1100.0" fill="none" stroke="#185FA5" stroke-width="1.6"/>
<text class="ts" x="243.1" y="1075.9" text-anchor="start" fill="#185FA5">θ₂ + θ₃ = -32.5°</text>
<path d="M329.6 1164.6 A40 40 0 0 1 315.9 1177.7" fill="none" stroke="#D85A30" stroke-width="2.2"/>
<text class="ts" x="352.6" y="1206.4" text-anchor="middle" fill="#D85A30">θ₄ = -27.5°</text>
<path d="M319.9 1143.1 A24 24 0 0 1 307.9 1163.9" fill="none" stroke="#0F6E56" stroke-width="1.4"/>
<text class="ts" x="323.9" y="1147.1" text-anchor="start" fill="#0F6E56">φ</text>
<circle cx="323.9" cy="1191.6" r="6" fill="#FFFFFF" stroke="#D85A30" stroke-width="2.5"/>
<text class="ts" x="311.9" y="1209.6" text-anchor="end">target</text>
<text class="eq" x="32.0" y="1354.0" text-anchor="start">φ = θ₂ + θ₃ + θ₄</text>
<text class="eq" x="32.0" y="1375.0" text-anchor="start">θ₄ = φ − θ₂ − θ₃ = -60 − 60.7 − (-93.2) = -27.5°</text>
<text class="nt" x="32.0" y="1396.0" text-anchor="start">link angles from horizontal add up (axes z₁ z₂ z₃ are parallel):</text>
<text class="nt" x="32.0" y="1414.0" text-anchor="start">link a₂: θ₂ · link a₃: θ₂ + θ₃ · link a₄: θ₂ + θ₃ + θ₄ = φ</text>
