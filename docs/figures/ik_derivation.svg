<text class="h1" x="18.0" y="34.0" text-anchor="start">Solving Inverse Kinematics step by step</text>
<text class="ts" x="18.0" y="58.0" text-anchor="start">Example: tip target (x, y, z) = (150, 90, 120) mm · tip angle φ = -60° · elbow up  (a₂ = 137.0, a₃ = 98.3, a₄ = 50.0, d₁ = 96.7 mm)</text>
<rect class="box" x="18" y="78" width="470" height="456" rx="8" stroke-width="0.8"/>
<rect class="c-purple" x="18" y="78" width="470" height="30" rx="8" stroke-width="0.8"/>
<text class="th" x="30.0" y="98.0" text-anchor="start" fill="#3C3489">Step 1 · base angle θ₁ (top view)</text>
<line x1="56.5" y1="328.0" x2="412.8" y2="328.0" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="218.0" y1="366.0" x2="218.0" y2="185.5" stroke="#5F5E5A" stroke-width="1" marker-end="url(#arrow)"/>
<text class="ts" x="415.6" y="341.3" text-anchor="start">x</text>
<text class="ts" x="223.7" y="189.3" text-anchor="start">y</text>
<line x1="218.0" y1="328.0" x2="360.5" y2="242.5" stroke="#D85A30" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="218.0" y1="328.0" x2="161.0" y2="362.2" stroke="#D85A30" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
<text class="nt" x="157.2" y="366.0" text-anchor="end">2nd solution: θ₁ + 180°</text>
<line x1="360.5" y1="328.0" x2="360.5" y2="242.5" stroke="#0F6E56" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="218.0" y1="242.5" x2="360.5" y2="242.5" stroke="#0F6E56" stroke-width="1" stroke-dasharray="4 3"/>
<circle cx="360.5" cy="242.5" r="6" fill="#FFFFFF" stroke="#D85A30" stroke-width="2.5"/>
<text class="ts" x="370.0" y="234.9" text-anchor="start">target (150, 90)</text>
<text class="ts" x="272.1" y="271.9" text-anchor="end" fill="#D85A30">r = 174.9</text>
<text class="ts" x="360.5" y="343.2" text-anchor="middle" fill="#0F6E56">x = 150</text>
<text class="ts" x="210.4" y="246.3" text-anchor="end" fill="#0F6E56">y = 90</text>
<path d="M264.0 328.0 A46 46 0 0 0 257.4 304.3" fill="none" stroke="#D85A30" stroke-width="1.8"/>
<text class="ts" x="293.2" y="311.2" text-anchor="middle" fill="#D85A30">θ₁ = 31.0°</text>
<circle cx="218.0" cy="328.0" r="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
<text class="nt" x="474.0" y="128.0" text-anchor="end">top view</text>
<text class="eq" x="32.0" y="406.0" text-anchor="start">r = √(x² + y²) = √(150² + 90²) = 174.9 mm</text>
<text class="eq" x="32.0" y="427.0" text-anchor="start">θ₁ = atan2(y, x) = atan2(90, 150) = 31.0°</text>
<text class="nt" x="32.0" y="448.0" text-anchor="start">the slides' Spong-style Atan2(x, y) = np.arctan2(y, x)</text>
<text class="nt" x="32.0" y="466.0" text-anchor="start">2nd solution (slides π + Atan2): face away, r &lt; 0 — near the base axis (r &lt; 30 mm)</text>
<rect class="box" x="506" y="78" width="470" height="456" rx="8" stroke-width="0.8"/>
<rect class="c-purple" x="506" y="78" width="470" height="30" rx="8" stroke-width="0.8"/>
<text class="th" x="518.0" y="98.0" text-anchor="start" fill="#3C3489">Step 2 · step back from tip to wrist (kinematic decoupling)</text>
<line x1="526.0" y1="378.0" x2="956.0" y2="378.0" stroke="#5F5E5A" stroke-width="0.6"/>
<rect class="c-gray" x="600.3" y="364.6" width="31.4" height="13.4" rx="2" stroke-width="0.5"/>
<line x1="616.0" y1="364.6" x2="616.0" y2="269.7" stroke="#888780" stroke-width="6" stroke-linecap="round"/>
<line x1="616.0" y1="269.7" x2="691.1" y2="135.9" stroke="#C9C7BE" stroke-width="6" stroke-linecap="round"/>
<line x1="691.1" y1="135.9" x2="783.9" y2="195.1" stroke="#C9C7BE" stroke-width="6" stroke-linecap="round"/>
<line x1="783.9" y1="195.1" x2="811.9" y2="243.6" stroke="#C9C7BE" stroke-width="6" stroke-linecap="round"/>
<circle cx="691.1" cy="135.9" r="3.5" fill="#FFFFFF" stroke="#C9C7BE" stroke-width="1.5"/>
<circle cx="783.9" cy="195.1" r="3.5" fill="#FFFFFF" stroke="#C9C7BE" stroke-width="1.5"/>
<line x1="616.0" y1="269.7" x2="783.9" y2="269.7" stroke="#0F6E56" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="783.9" y1="269.7" x2="783.9" y2="195.1" stroke="#0F6E56" stroke-width="1" stroke-dasharray="4 3"/>
<line x1="811.9" y1="378.0" x2="811.9" y2="243.6" stroke="#5F5E5A" stroke-width="0.6" stroke-dasharray="2 3"/>
<line x1="811.9" y1="243.6" x2="783.9" y2="195.1" stroke="#185FA5" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="811.9" y1="243.6" x2="856.7" y2="243.6" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="3 3"/>
<path d="M841.9 243.6 A30 30 0 0 1 826.9 269.6" fill="none" stroke="#D85A30" stroke-width="1.6"/>
<text class="ts" x="861.9" y="247.6" text-anchor="start" fill="#D85A30">φ = -60°</text>
<circle cx="811.9" cy="243.6" r="6" fill="#FFFFFF" stroke="#D85A30" stroke-width="2.5"/>
<circle cx="783.9" cy="195.1" r="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="2.2"/>
<circle cx="616.0" cy="269.7" r="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
<text class="ts" x="817.9" y="289.6" text-anchor="start">target</text>
<text class="ts" x="792.9" y="187.1" text-anchor="start" fill="#0F6E56">wrist</text>
<text class="ts" x="805.9" y="213.4" text-anchor="start" fill="#185FA5">a₄</text>
<text class="ts" x="700.0" y="285.7" text-anchor="middle" fill="#0F6E56">rc = 149.9</text>
<text class="ts" x="777.9" y="236.4" text-anchor="end" fill="#0F6E56">s = 66.6</text>
<line x1="607.0" y1="378.0" x2="607.0" y2="269.7" stroke="#5F5E5A" stroke-width="0.8" marker-end="url(#arrow)"/>
<text class="ts" x="602.6" y="323.8" text-anchor="end">d₁</text>
<text class="nt" x="962.0" y="128.0" text-anchor="end">side view (arm plane)</text>
<text class="eq" x="520.0" y="406.0" text-anchor="start">rc = r − a₄·cos φ = 174.9 − 50·cos(-60°) = 149.9 mm</text>
<text class="eq" x="520.0" y="427.0" text-anchor="start">s = z − d₁ − a₄·sin φ = 120 − 96.7 − 50·sin(-60°) = 66.6 mm</text>
<text class="eq" x="520.0" y="448.0" text-anchor="start">L = √(rc² + s²) = 164.1 mm   (wrist ↔ shoulder)</text>
<text class="nt" x="520.0" y="469.0" text-anchor="start">the tip always points along φ → the wrist is a₄ behind the tip</text>
<text class="nt" x="520.0" y="487.0" text-anchor="start">what is left: a 2-link arm (a₂, a₃) reaching the wrist (rc, s)</text>
<rect class="box" x="18" y="552" width="470" height="456" rx="8" stroke-width="0.8"/>
<rect class="c-purple" x="18" y="552" width="470" height="30" rx="8" stroke-width="0.8"/>
<text class="th" x="30.0" y="572.0" text-anchor="start" fill="#3C3489">Step 3 · law of cosines → θ₃ (elbow)</text>
<line x1="38.0" y1="852.0" x2="468.0" y2="852.0" stroke="#5F5E5A" stroke-width="0.6"/>
<rect class="c-gray" x="112.3" y="838.6" width="31.4" height="13.4" rx="2" stroke-width="0.5"/>
<line x1="128.0" y1="838.6" x2="128.0" y2="743.7" stroke="#888780" stroke-width="6" stroke-linecap="round"/>
<line x1="128.0" y1="743.7" x2="277.6" y2="777.7" stroke="#B9B5E8" stroke-width="4" stroke-dasharray="6 4" stroke-linecap="round"/>
<line x1="277.6" y1="777.7" x2="295.9" y2="669.1" stroke="#B9B5E8" stroke-width="4" stroke-dasharray="6 4" stroke-linecap="round"/>
<circle cx="277.6" cy="777.7" r="3.5" fill="#FFFFFF" stroke="#B9B5E8" stroke-width="1.5"/>
<polygon points="128.0,743.7 203.1,609.9 295.9,669.1" fill="#EEEDFE" fill-opacity="0.7" stroke="none"/>
<line x1="128.0" y1="743.7" x2="203.1" y2="609.9" stroke="#888780" stroke-width="6" stroke-linecap="round"/>
<line x1="203.1" y1="609.9" x2="295.9" y2="669.1" stroke="#888780" stroke-width="6" stroke-linecap="round"/>
<circle cx="203.1" cy="609.9" r="3.5" fill="#FFFFFF" stroke="#888780" stroke-width="1.5"/>
<line x1="128.0" y1="743.7" x2="295.9" y2="669.1" stroke="#7F77DD" stroke-width="2" stroke-dasharray="5 4"/>
<line x1="203.1" y1="609.9" x2="227.8" y2="565.9" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="3 3"/>
<path d="M215.8 587.2 A26 26 0 0 1 225.0 623.9" fill="none" stroke="#D85A30" stroke-width="1.8"/>
<text class="ts" x="263.2" y="598.8" text-anchor="middle" fill="#D85A30">θ₃ = -93.2°</text>
<path d="M214.9 617.4 A14 14 0 0 1 196.2 622.1" fill="none" stroke="#7F77DD" stroke-width="1.2"/>
<text class="nt" x="179.1" y="639.9" text-anchor="end" fill="#7F77DD">inner angle 180° − |θ₃|</text>
<circle cx="295.9" cy="669.1" r="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="2.2"/>
<circle cx="128.0" cy="743.7" r="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
<text class="ts" x="153.6" y="672.8" text-anchor="end">a₂ = 137</text>
<text class="ts" x="259.5" y="631.5" text-anchor="start">a₃ = 98.3</text>
<text class="ts" x="230.0" y="724.4" text-anchor="middle" fill="#7F77DD">L = 164.1</text>
<text class="nt" x="189.1" y="605.9" text-anchor="end">elbow up</text>
<text class="nt" x="281.6" y="795.7" text-anchor="middle" fill="#7F77DD">elbow down</text>
<text class="eq" x="32.0" y="880.0" text-anchor="start">L² = a₂² + a₃² − 2a₂a₃·cos(180° − |θ₃|) = a₂² + a₃² + 2a₂a₃·cos θ₃</text>
<text class="eq" x="32.0" y="901.0" text-anchor="start">D = cos θ₃ = (rc² + s² − a₂² − a₃²) / (2·a₂·a₃)</text>
<text class="eq" x="32.0" y="922.0" text-anchor="start">   = (164.1² − 137² − 98.3²) / (2·137·98.3) = -0.056</text>
<text class="eq" x="32.0" y="943.0" text-anchor="start">θ₃ = atan2(−√(1 − D²), D) = -93.2°</text>
<text class="nt" x="32.0" y="964.0" text-anchor="start">elbow up = minus sign (θ₃ &lt; 0) · elbow down = plus</text>
<text class="nt" x="32.0" y="982.0" text-anchor="start">solvable when |D| ≤ 1  ⇔  |a₂ − a₃| ≤ L ≤ a₂ + a₃  =  38.7 ≤ L ≤ 235.3 mm</text>
<rect class="box" x="506" y="552" width="470" height="456" rx="8" stroke-width="0.8"/>
<rect class="c-purple" x="506" y="552" width="470" height="30" rx="8" stroke-width="0.8"/>
<text class="th" x="518.0" y="572.0" text-anchor="start" fill="#3C3489">Step 4 · θ₂ (shoulder)</text>
<line x1="526.0" y1="852.0" x2="956.0" y2="852.0" stroke="#5F5E5A" stroke-width="0.6"/>
<rect class="c-gray" x="600.3" y="838.6" width="31.4" height="13.4" rx="2" stroke-width="0.5"/>
<line x1="616.0" y1="838.6" x2="616.0" y2="743.7" stroke="#888780" stroke-width="6" stroke-linecap="round"/>
<line x1="616.0" y1="743.7" x2="691.1" y2="609.9" stroke="#888780" stroke-width="6" stroke-linecap="round"/>
