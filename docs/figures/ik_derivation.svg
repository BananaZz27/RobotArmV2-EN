<rect class="c-purple" x="18" y="1026" width="470" height="30" rx="8" stroke-width="0.8"/>
<text class="th" x="30.0" y="1046.0" text-anchor="start" fill="#3C3489">Step 5 · θ₄ (wrist) from the tip angle</text>
<line x1="38.0" y1="1326.0" x2="468.0" y2="1326.0" stroke="#5F5E5A" stroke-width="0.6"/>
<rect class="c-gray" x="112.3" y="1312.6" width="31.4" height="13.4" rx="2" stroke-width="0.5"/>
