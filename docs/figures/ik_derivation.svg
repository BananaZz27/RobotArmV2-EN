<svg xmlns="http://www.w3.org/2000/svg" width="994" height="1500" viewBox="0 0 994 1500" role="img"><title>Solving Inverse Kinematics step by step</title><desc>Example: tip target (x, y, z) = (150, 90, 120) mm · tip angle φ = -60° · elbow up  (a₂ = 137.0, a₃ = 98.3, a₄ = 50.0, d₁ = 96.7 mm)</desc>
