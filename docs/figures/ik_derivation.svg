<line x1="616.0" y1="743.7" x2="783.9" y2="669.1" stroke="#7F77DD" stroke-width="2" stroke-dasharray="5 4"/>
<line x1="616.0" y1="743.7" x2="840.0" y2="743.7" stroke="#5F5E5A" stroke-width="0.8" stroke-dasharray="3 3"/>
<path d="M716.0 743.7 A100 100 0 0 0 707.4 703.1" fill="none" stroke="#0F6E56" stroke-width="1.8"/>
<text class="ts" x="753.0" y="718.6" text-anchor="middle" fill="#0F6E56">α = 24.0°</text>
<path d="M680.0 715.3 A70 70 0 0 0 650.3 682.7" fill="none" stroke="#185FA5" stroke-width="1.8"/>
<text class="ts" x="698.8" y="672.3" text-anchor="middle" fill="#185FA5">−β = 36.7°</text>
<path d="M652.0 743.7 A36 36 0 0 0 633.6 712.3" fill="none" stroke="#D85A30" stroke-width="2.2"/>
<text class="ts" x="608.0" y="699.7" text-anchor="end" fill="#D85A30">θ₂ = 60.7°</text>
<circle cx="783.9" cy="669.1" r="5" fill="#FFFFFF" stroke="#0F6E56" stroke-width="2.2"/>
<circle cx="616.0" cy="743.7" r="5" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.5"/>
<text class="ts" x="691.1" y="597.9" text-anchor="middle">elbow</text>
<text class="ts" x="792.9" y="661.1" text-anchor="start" fill="#0F6E56">wrist</text>
<text class="eq" x="520.0" y="880.0" text-anchor="start">α = atan2(s, rc) = atan2(66.6, 149.9) = 24.0°</text>
<text class="eq" x="520.0" y="901.0" text-anchor="start">β = atan2(a₃·sin θ₃, a₂ + a₃·cos θ₃)</text>
<text class="eq" x="520.0" y="922.0" text-anchor="start">   = atan2(-98.1, 131.5) = -36.7°</text>
<text class="eq" x="520.0" y="943.0" text-anchor="start">θ₂ = α − β = 24.0 − (-36.7) = 60.7°</text>
<text class="nt" x="520.0" y="964.0" text-anchor="start">α = angle of the shoulder→wrist line, β = angle between link a₂ and that line</text>
<text class="nt" x="520.0" y="982.0" text-anchor="start">elbow down: θ₃ = +93.2° → β = +36.7° → θ₂ = -12.8°</text>
