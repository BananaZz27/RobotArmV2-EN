<svg xmlns="http://www.w3.org/2000/svg" width="680" height="410" viewBox="0 0 680 410" role="img"><title>IK steps in the arm plane (example x=200, z=50, φ=−90°)</title><desc>step back from the tip to the wrist, find D and θ3 with the law of cosines, then θ2 and θ4</desc><style>
text{font-family:'Sarabun','Noto Sans Thai','Leelawadee UI','Tahoma',sans-serif}
.t{font-size:14px;fill:#2C2C2A}.ts{font-size:12px;fill:#444441}.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.c-purple{fill:#EEEDFE;stroke:#534AB7}.c-teal{fill:#E1F5EE;stroke:#0F6E56}.c-gray{fill:#F1EFE8;stroke:#5F5E5A}.c-coral{fill:#FAECE7;stroke:#993C1D}.c-coral text{fill:#712B13}.c-teal text{fill:#085041}.c-purple text{fill:#3C3489}.c-green{fill:#EAF3DE;stroke:#3B6D11}.c-green text{fill:#27500A}.c-red{fill:#FCEBEB;stroke:#A32D2D}.c-red text{fill:#791F1F}.c-blue{fill:#E6F1FB;stroke:#185FA5}.c-blue text{fill:#0C447C}.box{fill:#F8F7F3;stroke:#B4B2A9}
.leader{stroke:#888780;stroke-width:0.5;stroke-dasharray:3 3;fill:none}
</style><rect width="680" height="410" fill="#FFFFFF"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<line x1="50" y1="380" x2="400" y2="380" stroke="#5F5E5A" stroke-width="0.5"/>
<rect class="c-gray" x="70" y="368" width="40" height="12" rx="3" stroke-width="0.5"/>
<line x1="90" y1="273.6" x2="370" y2="273.6" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 3"/>
<line x1="310" y1="237.3" x2="370" y2="237.3" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 3"/>
<line x1="90" y1="273.6" x2="310" y2="237.3" stroke="#7F77DD" stroke-width="1" stroke-dasharray="5 4"/>
<line x1="213.9" y1="187.8" x2="246.8" y2="165" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 3"/>
<line x1="310" y1="237.3" x2="341.1" y2="253.3" stroke="#5F5E5A" stroke-width="0.5" stroke-dasharray="4 3"/>
<line x1="90" y1="368" x2="90" y2="273.6" stroke="#888780" stroke-width="7" stroke-linecap="round"/>
<line x1="90" y1="273.6" x2="213.9" y2="187.8" stroke="#888780" stroke-width="7" stroke-linecap="round"/>
<line x1="213.9" y1="187.8" x2="310" y2="237.3" stroke="#888780" stroke-width="7" stroke-linecap="round"/>
<line x1="310" y1="237.3" x2="310" y2="325" stroke="#888780" stroke-width="7" stroke-linecap="round"/>
<path d="M125 273.6 A35 35 0 0 0 118.8 253.7" fill="none" stroke="#D85A30" stroke-width="1.5"/>
<text class="ts" x="132" y="266">θ₂</text>
<path d="M236.9 171.9 A28 28 0 0 1 238.8 200.6" fill="none" stroke="#D85A30" stroke-width="1.5"/>
<text class="ts" x="250" y="187">θ₃ &lt; 0</text>
<path d="M333.1 249.2 A26 26 0 0 1 310 263.3" fill="none" stroke="#D85A30" stroke-width="1.5"/>
<line x1="365" y1="271" x2="365" y2="240" stroke="#5F5E5A" stroke-width="0.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="ts" x="371" y="259">s = 3.3</text>
<line x1="92" y1="350" x2="308" y2="350" stroke="#5F5E5A" stroke-width="0.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text class="ts" x="200" y="366" text-anchor="middle">rc = 200.0</text>
<text class="ts" x="302" y="292" text-anchor="end">a4 = 50.0</text>
<text class="ts" x="160" y="217" text-anchor="end">a2 = 137.0</text>
<text class="ts" x="236" y="230" text-anchor="middle">a3 = 98.3</text>
<circle class="c-purple" cx="90" cy="273.6" r="7" stroke-width="1"/>
<circle class="c-purple" cx="213.9" cy="187.8" r="7" stroke-width="1"/>
<circle class="c-purple" cx="310" cy="237.3" r="7" stroke-width="1"/>
<circle cx="310" cy="325" r="5" fill="#D85A30"/>
<text class="ts" x="318" y="222">wrist (rc, s)</text>
<text class="ts" x="318" y="322">target (x, z) = (200, 50)</text>
<text class="ts" x="318" y="338">φ = −90° (down)</text>
<g class="c-coral"><circle cx="300" cy="208" r="9" stroke-width="0.5"/><text class="th" x="300" y="208" text-anchor="middle" dominant-baseline="central">2</text></g>
<g class="c-coral"><circle cx="203" cy="166" r="9" stroke-width="0.5"/><text class="th" x="203" y="166" text-anchor="middle" dominant-baseline="central">3</text></g>
<g class="c-coral"><circle cx="150" cy="293" r="9" stroke-width="0.5"/><text class="th" x="150" y="293" text-anchor="middle" dominant-baseline="central">4</text></g>
<g class="c-coral"><circle cx="322" cy="289" r="9" stroke-width="0.5"/><text class="th" x="322" y="289" text-anchor="middle" dominant-baseline="central">5</text></g>
<text class="ts" x="336" y="293">θ₄</text>
<text class="th" x="436" y="50">IK steps</text>
<g class="c-coral"><circle cx="442" cy="72" r="8" stroke-width="0.5"/><text class="ts" x="442" y="72" text-anchor="middle" dominant-baseline="central">1</text></g>
<text class="ts" x="456" y="76">θ₁ = atan2(y, x) = 0°  (top view)</text>
<g class="c-coral"><circle cx="442" cy="104" r="8" stroke-width="0.5"/><text class="ts" x="442" y="104" text-anchor="middle" dominant-baseline="central">2</text></g>
<text class="ts" x="456" y="108">step back from the tip to the wrist along φ</text>
<text class="ts" x="456" y="126">rc = r − a4·cos φ = 200.0</text>
<text class="ts" x="456" y="144">s = z − a4·sin φ − d1 = 3.3</text>
<g class="c-coral"><circle cx="442" cy="172" r="8" stroke-width="0.5"/><text class="ts" x="442" y="172" text-anchor="middle" dominant-baseline="central">3</text></g>
<text class="ts" x="456" y="176">law of cosines (purple dashes = 3rd side)</text>
<text class="ts" x="456" y="194">D = (rc²+s²−a2²−a3²)/(2·a2·a3)</text>
<text class="ts" x="456" y="212">D = 0.430</text>
<text class="ts" x="456" y="230">θ₃ = atan2(−√(1−D²), D) = −64.5°</text>
<g class="c-coral"><circle cx="442" cy="258" r="8" stroke-width="0.5"/><text class="ts" x="442" y="258" text-anchor="middle" dominant-baseline="central">4</text></g>
<text class="ts" x="456" y="262">θ₂ = atan2(s, rc)</text>
<text class="ts" x="456" y="280">  − atan2(a3·sinθ₃, a2 + a3·cosθ₃)</text>
<text class="ts" x="456" y="298">θ₂ = 27.3°</text>
<g class="c-coral"><circle cx="442" cy="326" r="8" stroke-width="0.5"/><text class="ts" x="442" y="326" text-anchor="middle" dominant-baseline="central">5</text></g>
<text class="ts" x="456" y="330">θ₄ = φ − θ₂ − θ₃ = −52.7°</text>
<text class="th" x="436" y="366">convert to servo angles</text>
<text class="ts" x="436" y="390">q = (0, 62.7, 64.5, 52.7)</text>
</svg>
